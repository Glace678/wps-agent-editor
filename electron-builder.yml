appId: com.wpsagent.editor
productName: WPS Agent Editor
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: docker
    to: docker
    filter:
      - "**/*"
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  target:
    - nsis
    - portable
linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: WPS Agent Editor
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true