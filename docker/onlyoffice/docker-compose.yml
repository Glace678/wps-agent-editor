services:
  onlyoffice-documentserver:
    image: onlyoffice/documentserver:9.4.0.1
    container_name: oo-documentserver
    ports:
      - "127.0.0.1:8080:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${OO_JWT_SECRET:?Set OO_JWT_SECRET to at least 32 random bytes}
      JWT_HEADER: Authorization
    volumes:
      - oo_data:/var/www/onlyoffice/Data
      - oo_logs:/var/log/onlyoffice
    restart: unless-stopped

volumes:
  oo_data:
  oo_logs:
