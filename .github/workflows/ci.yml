name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          components: rustfmt, clippy
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev \
            libxdo-dev patchelf
      - run: npm ci
      - run: npm run check:engine-patches
      - run: node scripts/check-version.mjs
      - run: npm run check:sensitive
      - run: node scripts/release/test-release-contract.mjs
      # Audit gate supports time-boxed exceptions in audit-exceptions.json so a
      # fresh upstream advisory cannot permanently freeze releases.
      - name: Audit all dependencies (production + development)
        run: node scripts/check-npm-audit.mjs --mode full
      - name: Audit production dependencies only
        run: node scripts/check-npm-audit.mjs --mode production
      - name: Verify Windows installer hook ProgID coverage
        run: >-
          node scripts/release/verify-bundle-associations.mjs
          --platform windows
          --hooks src-tauri/windows/installer-hooks.nsh
      - run: npm run check:i18n
      - run: npm run check:providers
      - run: npm run test:web-canaries
      - run: npm run check:generated
      - run: npm run typecheck
      - run: npm run build:web
      - run: node scripts/release/check-bundle-inputs.mjs
      - run: npx playwright install --with-deps chromium
      # C5: CI runners are slower than dev machines — widen whole-test and
      # per-step timeouts via env instead of inflating local defaults.
      - name: Run e2e tests
        run: npm run test:e2e
        env:
          WAE_E2E_TEST_TIMEOUT_MS: '120000'
          WAE_E2E_STEP_TIMEOUT_MS: '45000'
          # D3: widen perf budgets on slower CI runners rather than inflating
          # local defaults or hiding slow paths behind large timeouts.
          WAE_PERF_BUDGET_FACTOR: '3'
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  package:
    if: github.event_name == 'pull_request'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, platform: windows, arch: x86_64, target: x86_64-pc-windows-msvc, bundles: nsis }
          - { runner: windows-11-arm, platform: windows, arch: aarch64, target: aarch64-pc-windows-msvc, bundles: nsis }
          - { runner: macos-15-intel, platform: macos, arch: x86_64, target: x86_64-apple-darwin, bundles: dmg, deployment_target: '10.15' }
          - { runner: macos-15, platform: macos, arch: aarch64, target: aarch64-apple-darwin, bundles: dmg, deployment_target: '11.0' }
          - { runner: ubuntu-22.04, platform: linux, arch: x86_64, target: x86_64-unknown-linux-gnu, bundles: appimage }
          - { runner: ubuntu-22.04-arm, platform: linux, arch: aarch64, target: aarch64-unknown-linux-gnu, bundles: appimage }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      WAE_BUILD_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev \
            libxdo-dev patchelf
      - run: npm ci
      - run: npm run check:engine-patches
      - run: npm run prepare:sidecar -- --target ${{ matrix.target }}
      - name: Build and audit renderer
        run: |
          npm run build:web
          node scripts/release/check-bundle-inputs.mjs --target ${{ matrix.target }}
      - name: Generate unsigned bundle config
        shell: bash
        run: node scripts/release/tauri-unsigned-config.mjs "$RUNNER_TEMP/tauri-unsigned.json"
      - name: Build unsigned test bundle
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "${{ runner.temp }}/tauri-unsigned.json"
      - name: Collect and enforce primary package size
        run: |
          node scripts/release/collect-unsigned-artifact.mjs ${{ matrix.platform }} ${{ matrix.arch }} src-tauri/target/${{ matrix.target }}/release/bundle pr-artifact
          node scripts/release/check-artifacts.mjs pr-artifact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-pr-${{ matrix.platform }}-${{ matrix.arch }}
          path: pr-artifact/*
          if-no-files-found: error
          retention-days: 7
