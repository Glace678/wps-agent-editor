name: Signed staging release smoke

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Signed GitHub Release tag to install and smoke (for example v2.0.1)
        required: true
        type: string
      previous_tag:
        description: Optional older published tag for updater acceptance (for example v2.0.0)
        required: false
        default: ''
        type: string
      promote:
        description: Promote the accepted prerelease to the stable channel
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  attestations: read

concurrency:
  group: staging-smoke-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PREVIOUS_TAG: ${{ inputs.previous_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validate requested releases and updater verification key
        shell: bash
        run: |
          test -n "$TAURI_UPDATER_PUBLIC_KEY" || { echo 'Missing TAURI_UPDATER_PUBLIC_KEY secret' >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'release_tag must be a stable SemVer tag without a prerelease suffix' >&2; exit 1; }
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease)"
          [[ "$(jq -r .isDraft <<<"$release_json")" == false ]] || { echo 'release_tag must be published' >&2; exit 1; }
          [[ "$(jq -r .isPrerelease <<<"$release_json")" == true ]] || { echo 'release_tag must remain a prerelease until staging acceptance passes' >&2; exit 1; }
          if [[ -z "$PREVIOUS_TAG" ]]; then
            # No bootstrap exemption: every promotion is gated by an updater
            # acceptance run, including the first stable release.
            echo 'previous_tag is required for updater acceptance before promotion' >&2
            exit 1
          fi
          if [[ -n "$PREVIOUS_TAG" ]]; then
            [[ "$PREVIOUS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'previous_tag must be a stable SemVer tag' >&2; exit 1; }
            previous_json="$(gh release view "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease)"
            [[ "$(jq -r .isDraft <<<"$previous_json")" == false ]] || { echo 'previous_tag must be published' >&2; exit 1; }
            [[ "$(jq -r .isPrerelease <<<"$previous_json")" == false ]] || { echo 'previous_tag must be a stable release' >&2; exit 1; }
          fi

  install-smoke:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, platform: windows, arch: x86_64, primary_suffix: '-setup.exe' }
          - { runner: windows-11-arm, platform: windows, arch: aarch64, primary_suffix: '-setup.exe' }
          - { runner: macos-15-intel, platform: macos, arch: x86_64, primary_suffix: '.dmg' }
          - { runner: macos-15, platform: macos, arch: aarch64, primary_suffix: '.dmg' }
          - { runner: ubuntu-22.04, platform: linux, arch: x86_64, primary_suffix: '.AppImage' }
          - { runner: ubuntu-22.04-arm, platform: linux, arch: aarch64, primary_suffix: '.AppImage' }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      PRIMARY_PATH: smoke-artifacts/${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.primary_suffix }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install Linux runtime smoke dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            file xvfb dbus-x11 libgtk-3-0 libwebkit2gtk-4.1-0 \
            libayatana-appindicator3-1 librsvg2-2 xdg-utils
      - name: Fetch internal updater fixtures
        shell: bash
        run: |
          run_id="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs?event=push&head_branch=$RELEASE_TAG&per_page=30" \
            | jq -r --arg name 'Signed cross-platform release' \
              '.workflow_runs[] | select(.name==$name and .conclusion=="success") | .id' | head -n1)"
          test -n "$run_id" || { echo "Could not locate a successful signed release workflow run for $RELEASE_TAG" >&2; exit 1; }
          gh run download "$run_id" --name release-fixtures --dir internal-fixtures
      - name: Download exact release assets
        shell: bash
        run: >-
          node scripts/release/download-release-smoke.mjs
          --tag "$RELEASE_TAG"
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"
          --directory smoke-artifacts
      - name: Verify names, checksums, size, latest.json, and updater signature
        shell: bash
        run: >-
          node scripts/release/verify-release-smoke.mjs
          --tag "$RELEASE_TAG"
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"
          --directory smoke-artifacts
          --fixtures-directory internal-fixtures
      - name: Verify GitHub build provenance
        shell: bash
        run: gh attestation verify "$PRIMARY_PATH" --repo "$GITHUB_REPOSITORY"
      - name: Windows Authenticode/install/start/uninstall smoke
        if: matrix.platform == 'windows'
        shell: pwsh
        run: >-
          ./scripts/release/windows-install-smoke.ps1
          -Artifact "$env:PRIMARY_PATH"
          -Arch "${{ matrix.arch }}"
          -LogDirectory smoke-logs
      - name: macOS notarization/install/start/remove smoke
        if: matrix.platform == 'macos'
        shell: bash
        run: >-
          bash scripts/release/macos-install-smoke.sh
          "$PRIMARY_PATH"
          '${{ matrix.arch }}'
          smoke-logs
          "smoke-artifacts/macos-${{ matrix.arch }}.app.tar.gz"
      - name: Linux AppImage extract/start/remove smoke
        if: matrix.platform == 'linux'
        shell: bash
        run: bash scripts/release/linux-install-smoke.sh "$PRIMARY_PATH" '${{ matrix.arch }}' smoke-logs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: staging-smoke-${{ inputs.release_tag }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: smoke-logs
          if-no-files-found: ignore
          retention-days: 14

  updater-smoke:
    needs: install-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, platform: windows, arch: x86_64 }
          - { runner: windows-11-arm, platform: windows, arch: aarch64 }
          - { runner: macos-15-intel, platform: macos, arch: x86_64 }
          - { runner: macos-15, platform: macos, arch: aarch64 }
          - { runner: ubuntu-22.04, platform: linux, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, platform: linux, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PREVIOUS_TAG: ${{ inputs.previous_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install Linux updater-test dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            file xvfb dbus-x11 libgtk-3-0 libwebkit2gtk-4.1-0 \
            libayatana-appindicator3-1 librsvg2-2 xdg-utils
      - name: Fetch internal updater fixtures
        shell: bash
        run: |
          run_id="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs?event=push&head_branch=$RELEASE_TAG&per_page=30" \
            | jq -r --arg name 'Signed cross-platform release' \
              '.workflow_runs[] | select(.name==$name and .conclusion=="success") | .id' | head -n1)"
          test -n "$run_id" || { echo "Could not locate a successful signed release workflow run for $RELEASE_TAG" >&2; exit 1; }
          gh run download "$run_id" --name release-fixtures --dir internal-fixtures
      - name: Download current updater inputs
        shell: bash
        run: >-
          node scripts/release/download-release-smoke.mjs
          --tag "$RELEASE_TAG"
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"
          --directory current-release
      - name: Download previous installer inputs
        shell: bash
        run: >-
          node scripts/release/download-release-smoke.mjs
          --tag "$PREVIOUS_TAG"
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"
          --directory previous-release
      - name: Verify current and previous signed assets
        shell: bash
        run: |
          node scripts/release/verify-release-smoke.mjs --tag "$RELEASE_TAG" --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --directory current-release
          node scripts/release/verify-release-smoke.mjs --tag "$PREVIOUS_TAG" --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --directory previous-release
      - name: Exercise updater, startup health rollback, tamper rejection, and invalid-install preservation
        shell: bash
        run: >-
          node scripts/release/updater-smoke.mjs
          --previous-tag "$PREVIOUS_TAG"
          --current-tag "$RELEASE_TAG"
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"
          --previous-directory previous-release
          --current-directory current-release
          --fixtures-directory internal-fixtures
          --report "updater-${{ matrix.platform }}-${{ matrix.arch }}-smoke-report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: updater-smoke-${{ inputs.previous_tag }}-to-${{ inputs.release_tag }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: updater-*-smoke-report.json
          if-no-files-found: ignore
          retention-days: 14

  promote:
    needs: [install-smoke, updater-smoke]
    if: >-
      always() &&
      inputs.promote &&
      needs.install-smoke.result == 'success' &&
      needs.updater-smoke.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    # Protected environment: configure "stable-channel" with required reviewers
    # in repository settings so promotion needs human approval in addition to
    # the smoke gates. The workflow cannot promote without that environment.
    environment:
      name: stable-channel
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Confirm the release is still an unpublished prerelease
        shell: bash
        run: |
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)"
          [[ "$(jq -r .isDraft <<<"$release_json")" == false ]] || { echo 'Cannot promote a draft release' >&2; exit 1; }
          [[ "$(jq -r .isPrerelease <<<"$release_json")" == true ]] || {
            echo 'Release is already on the stable channel; refusing to promote again' >&2
            exit 1
          }
      - name: Re-verify all public release assets before promotion
        shell: bash
        run: |
          targets=(
            'windows x86_64' 'windows aarch64'
            'macos x86_64' 'macos aarch64'
            'linux x86_64' 'linux aarch64'
          )
          for target in "${targets[@]}"; do
            read -r platform arch <<<"$target"
            directory="verify-${platform}-${arch}"
            node scripts/release/download-release-smoke.mjs \
              --tag "$RELEASE_TAG" --platform "$platform" --arch "$arch" --directory "$directory"
            node scripts/release/verify-release-smoke.mjs \
              --tag "$RELEASE_TAG" --platform "$platform" --arch "$arch" \
              --directory "$directory" --public-only
          done
      - name: Promote accepted prerelease to stable
        shell: bash
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
      - name: Publish the promoted manifest to the stable channel
        # wps_08 #2: the updater endpoint points at this rolling Release, not
        # at /releases/latest, so clients only see manifests published here
        # after the smoke gates and environment approval.
        shell: bash
        run: |
          mkdir -p channel-manifest
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'latest.json' --dir channel-manifest --clobber
          [[ -f channel-manifest/latest.json ]] || {
            echo 'Promoted release has no latest.json to publish' >&2
            exit 1
          }
          if gh release view stable-channel --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload stable-channel --repo "$GITHUB_REPOSITORY" \
              channel-manifest/latest.json --clobber
          else
            gh release create stable-channel --repo "$GITHUB_REPOSITORY" \
              --title 'Stable update channel' \
              --notes 'Rolling updater manifest; published by the promote job after staging smoke tests.' \
              channel-manifest/latest.json
          fi
